<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rifas Brasil - Grupo VIP</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(180deg,#021108,#000);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    overflow-x:hidden;
}

.container{
    width:100%;
    max-width:420px;
    background:#08160d;
    border:2px solid #25D366;
    border-radius:25px;
    padding:26px 18px;
    text-align:center;
    box-shadow:0 0 30px rgba(37,211,102,.4);
}

.logo{
    font-size:30px;
    font-weight:900;
    color:#FFD700;
    margin-bottom:12px;
}

.titulo{
    font-size:38px;
    font-weight:900;
    color:#FFD700;
    margin-bottom:8px;
}

.subtitulo{
    font-size:19px;
    color:#FFFFFF;
    font-weight:600;
    line-height:1.35;
    margin-bottom:22px;
}

.texto-barra{
    font-size:19px;
    font-weight:900;
    color:#FFFFFF;
    margin-bottom:10px;
}

.barra-fundo{
    width:100%;
    height:34px;
    background:#1b1b1b;
    border-radius:50px;
    overflow:hidden;
    border:2px solid #FFD700;
}

.barra{
    width:0%;
    height:100%;
    background:linear-gradient(90deg,#00ff66,#FFD700);
    border-radius:50px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#000;
    font-weight:900;
    font-size:16px;
}

.botao{
    display:block;
    width:100%;
    margin-top:22px;
    background:#25D366;
    color:white;
    text-decoration:none;
    padding:17px;
    border-radius:15px;
    font-size:21px;
    font-weight:900;
    box-shadow:0 0 20px rgba(37,211,102,.8);
    transition:.2s;
}

.botao:hover{
    transform:scale(1.02);
}

.cards{
    display:flex;
    gap:9px;
    margin-top:18px;
}

.card{
    flex:1;
    background:#111;
    border-radius:12px;
    padding:9px;
    color:white;
    font-size:12px;
    font-weight:bold;
}

.rodape{
    margin-top:14px;
    color:#ccc;
    font-size:12px;
}

@media(max-width:480px){
    body{
        align-items:flex-start;
        padding:14px 14px 10px;
    }

    .container{
        max-width:100%;
        padding:20px 14px;
        border-radius:22px;
    }

    .logo{
        font-size:26px;
        margin-bottom:9px;
    }

    .titulo{
        font-size:32px;
        margin-bottom:7px;
    }

    .subtitulo{
        font-size:16px;
        margin-bottom:18px;
    }

    .texto-barra{
        font-size:16px;
        margin-bottom:9px;
    }

    .barra-fundo{
        height:32px;
    }

    .botao{
        margin-top:18px;
        font-size:18px;
        padding:15px 10px;
    }

    .cards{
        margin-top:15px;
        gap:7px;
    }

    .card{
        font-size:11px;
        padding:8px 5px;
    }

    .rodape{
        margin-top:12px;
        font-size:11px;
    }
}

@media(max-height:680px){
    body{
        align-items:flex-start;
        padding-top:10px;
    }

    .container{
        padding:16px 13px;
        transform:scale(.96);
        transform-origin:top center;
    }

    .logo{
        font-size:24px;
        margin-bottom:7px;
    }

    .titulo{
        font-size:30px;
    }

    .subtitulo{
        font-size:15px;
        margin-bottom:14px;
    }

    .texto-barra{
        font-size:15px;
    }

    .botao{
        margin-top:15px;
        font-size:17px;
        padding:14px 8px;
    }

    .cards{
        margin-top:13px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">🎟️ RIFAS BRASIL</div>

    <div class="titulo">🎉 PARABÉNS!</div>

    <div class="subtitulo">
        Você foi selecionado para entrar no Grupo VIP de Rifas
    </div>

    <div class="texto-barra">
        ESTÁ QUASE LÁ, GARANTA SUA VAGA!
    </div>

    <div class="barra-fundo">
        <div class="barra" id="barra">0%</div>
    </div>

    <a href="https://chat.whatsapp.com/HBuTi3epBOD0rINpDwQouV" class="botao">
        👉 ENTRAR NO GRUPO VIP
    </a>

    <div class="cards">
        <div class="card">🎁<br>Prêmios Diários</div>
        <div class="card">🏆<br>Loteria Federal</div>
        <div class="card">🎯<br>100 Números</div>
    </div>

    <div class="rodape">
        Sorteios todos os dias • Grupo VIP Oficial
    </div>

</div>

<script>
const barra = document.getElementById('barra');

let progresso = 0;
const alvo = 91;

const animacao = setInterval(() => {
    progresso++;

    barra.style.width = progresso + "%";
    barra.innerHTML = progresso + "%";

    if(progresso >= alvo){
        clearInterval(animacao);
    }
}, 8);
</script>

</body>
</html>
