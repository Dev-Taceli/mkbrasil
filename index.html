<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(180deg,#021108,#000);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:420px;
    background:#08160d;
    border:2px solid #25D366;
    border-radius:25px;
    padding:30px 20px;
    text-align:center;
    box-shadow:0 0 30px rgba(37,211,102,.4);
}

.logo{
    font-size:32px;
    font-weight:900;
    color:#FFD700;
    margin-bottom:15px;
}

.titulo{
    font-size:42px;
    font-weight:900;
    color:#FFD700;
    margin-bottom:10px;
}

.subtitulo{
    font-size:20px;
    color:#FFFFFF;
    font-weight:600;
    line-height:1.4;
    margin-bottom:25px;
}

.texto-barra{
    font-size:20px;
    font-weight:900;
    color:#FFFFFF;
    margin-bottom:12px;
}

.barra-fundo{
    width:100%;
    height:35px;
    background:#1b1b1b;
    border-radius:50px;
    overflow:hidden;
    border:2px solid #FFD700;
}

.barra{
    width:0%;
    height:100%;
    background:linear-gradient(90deg,#00ff66,#FFD700);
    border-radius:50px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#000;
    font-weight:900;
    font-size:16px;
}

.aviso{
    margin-top:18px;
    color:#FFD700;
    font-size:18px;
    font-weight:bold;
}

.botao{
    display:block;
    width:100%;
    margin-top:25px;
    background:#25D366;
    color:white;
    text-decoration:none;
    padding:18px;
    border-radius:15px;
    font-size:22px;
    font-weight:900;
    box-shadow:0 0 20px rgba(37,211,102,.8);
}

.botao:hover{
    transform:scale(1.02);
}

.cards{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.card{
    flex:1;
    background:#111;
    border-radius:12px;
    padding:10px;
    color:white;
    font-size:13px;
    font-weight:bold;
}

.rodape{
    margin-top:15px;
    color:#ccc;
    font-size:13px;
}

@media(max-width:480px){

    body{
        align-items:flex-start;
        padding-top:28px;
        padding-left:20px;
        padding-right:20px;
        padding-bottom:20px;
    }

    .container{
        padding:25px 15px;
    }

    .titulo{
        font-size:36px;
    }

    .subtitulo{
        font-size:18px;
    }

    .texto-barra{
        font-size:18px;
    }

    .botao{
        font-size:20px;
    }

}

</style>

        Você foi selecionado para entrar no Grupo VIP de Rifas

<script>

const barra = document.getElementById('barra');

let progresso = 0;
const alvo = 91;

const animacao = setInterval(() => {

    progresso++;

    barra.style.width = progresso + "%";
    barra.innerHTML = progresso + "%";

    if(progresso >= alvo){
        clearInterval(animacao);
    }

}, 8);

</script>
